[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svs-cli"
version = "0.1.0"
description = "SVS API command line tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
codegen = ["openapi-python-client>=0.27,<1"]

[project.scripts]
svs = "svs_cli:main"
svs-cli = "svs_cli:main"

[tool.setuptools]
py-modules = ["svs_cli"]
